<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>타자 모험 실험실 v0.1</title>
<style>
:root{--ink:#14324a;--line:#cfe0ea;--btn:#ffc93c;--bad:#e5484d;--ok:#2f9e44;--bg:#eef5f9}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body.play footer{display:none}body:not(.play) .kb{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;display:flex;flex-direction:column;min-height:100dvh;-webkit-tap-highlight-color:transparent}
header{display:flex;align-items:center;gap:10px;padding:8px 14px;background:#fff;border-bottom:2px solid var(--line)}
header h1{font-size:17px;margin:0;flex:1}
header small{color:#6b7f8e;font-weight:600}
button{font:inherit;color:inherit;cursor:pointer}
.btn{background:var(--btn);border:0;border-radius:12px;padding:9px 16px;font-weight:800;box-shadow:0 3px 0 #d79a00}
.btn.gray{background:#e3ebf0;box-shadow:0 3px 0 #b9c7d1}
main{flex:1;display:flex;flex-direction:column;min-height:0;overflow:auto;padding:10px;gap:8px;max-width:980px;width:100%;margin:0 auto}
.menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.card{background:#fff;border:2px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:8px}
.card h2{margin:0;font-size:19px}.card p{margin:0;color:#4a6272;font-size:14px;line-height:1.5;flex:1}
.tagk{display:inline-block;background:#e7f0ff;color:#2b5cab;border-radius:99px;padding:2px 10px;font-size:12px;font-weight:800;align-self:flex-start}
table{border-collapse:collapse;width:100%;font-size:13px;background:#fff}
th,td{border:1px solid var(--line);padding:5px 6px;text-align:center}th{background:#f3f8fb}
.stage{flex:1;min-height:260px;background:#fff;border:2px solid var(--line);border-radius:16px;position:relative;overflow:hidden;display:flex;flex-direction:column}
.hud{display:flex;gap:8px;align-items:center;padding:6px 10px;border-bottom:1px solid var(--line);font-weight:800;font-size:14px;flex-wrap:wrap}
.hud .sp{flex:1}
.msg{min-height:1.5em;text-align:center;font-weight:800;padding:4px;font-size:clamp(14px,2.6vw,18px)}
.w{display:inline-flex;gap:1px;font-weight:900;white-space:nowrap}
.w b{font-weight:900;color:var(--ink);position:relative;padding:0 1px}
.w b.d{color:var(--ok)}.w b.c{color:var(--ink);background:#fff3bf;border-radius:5px}
.w b.c::after{content:"";position:absolute;left:0;bottom:-3px;height:3px;width:var(--p,0%);background:#f08c00;border-radius:2px}
.shake{animation:sh .25s}@keyframes sh{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.bar{height:12px;border-radius:99px;background:#e3ebf0;overflow:hidden;flex:1;min-width:60px}.bar i{display:block;height:100%;border-radius:99px;background:var(--ok)}
/* 전투 */
.field{flex:1;display:flex;align-items:center;justify-content:space-around;padding:8px;gap:8px;min-height:0}
.unit{display:flex;flex-direction:column;align-items:center;gap:6px;width:42%}
.blob{width:clamp(64px,16vw,120px);aspect-ratio:1;border-radius:26%;display:grid;place-items:center;font-size:clamp(28px,7vw,54px);position:relative;transition:transform .15s}
.blob.me{background:#74c0fc;border-radius:50%}.blob.foe{background:#ff8787}
.blob.guard{box-shadow:0 0 0 6px #4dabf7,0 0 0 10px #d0ebff}.blob.hit{transform:scale(.85) rotate(-6deg)}
.intent{background:#fff4e6;border:2px solid #ffa94d;border-radius:12px;padding:4px 10px;font-weight:800;font-size:clamp(13px,2.4vw,16px);text-align:center;width:100%}
.intent.big{background:#ffe3e3;border-color:var(--bad)}.intent .bar i{background:#f08c00}
.cmds{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:8px}
.cmd{border:3px solid var(--line);border-radius:14px;padding:8px 4px;text-align:center;background:#f8fbfd}
.cmd.lock{border-color:#f08c00;background:#fff9db}.cmd.off{opacity:.45}
.cmd .t{font-size:12px;font-weight:800;color:#4a6272}.cmd .w{font-size:clamp(17px,3.6vw,28px);margin-top:2px}
@media(max-width:560px){.cmds{grid-template-columns:repeat(2,1fr)}}
/* 로봇 */
.robo{flex:1;display:flex;gap:10px;padding:10px;min-height:0}
.col{flex:1;border:2px dashed var(--line);border-radius:14px;display:flex;flex-direction:column-reverse;align-items:center;justify-content:flex-start;gap:6px;padding:8px;position:relative;overflow:hidden}
.col>h3{position:absolute;top:4px;left:0;right:0;text-align:center;margin:0;font-size:13px;color:#6b7f8e}
.part{width:min(86%,220px);border-radius:12px;padding:8px 6px;text-align:center;font-weight:900;font-size:clamp(16px,3.2vw,24px);color:#fff}
.part.q{background:#ced4da;color:#ced4da}
.bin{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:8px}
.bin .cmd{min-width:88px}
/* 미궁 */
.maze{flex:1;display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(5,1fr);gap:5px;padding:8px;min-height:0;max-width:640px;width:100%;margin:0 auto}
.cell{border-radius:10px;background:#3b4b57;display:grid;place-items:center;position:relative;font-weight:900;color:#fff;min-height:44px;overflow:hidden;text-align:center}
.cell.v{background:#e9f1f5;color:var(--ink)}.cell.me{outline:4px solid #f08c00;background:#fff3bf}
.cell.trap{background:#ffc9c9}.cell .n{position:absolute;left:5px;top:2px;font-size:12px;color:#c2255c}
.cell .ic{font-size:clamp(16px,4vw,26px)}
.cell .w{font-size:clamp(15px,4.3vw,22px);background:#fff;border-radius:8px;padding:1px 3px;border:2px solid #f08c00}
.cell.lock .w{background:#fff9db}
/* 자판 */
.kb{display:none;flex-direction:column;gap:4px;padding:6px 4px calc(6px + env(safe-area-inset-bottom));background:#dfe8ee}
.kb.on{display:flex}.kb .r{display:flex;gap:3px;justify-content:center}
.kb button{flex:1;max-width:58px;height:42px;border:0;border-radius:8px;background:#fff;font-weight:800;font-size:17px;box-shadow:0 2px 0 #b9c7d1;touch-action:manipulation}
.kb button.fn{background:#c5d3dc;max-width:74px;font-size:13px}.kb button.act{background:#ffd43b}
.modal{position:fixed;inset:0;background:rgba(20,50,74,.55);display:none;place-items:center;padding:14px;z-index:9}
.modal.on{display:grid}.box{background:#fff;border-radius:18px;padding:18px;max-width:440px;width:100%;text-align:center}
.box h2{margin:0 0 6px}.rate{display:flex;gap:6px;justify-content:center;margin:10px 0}
.rate button{width:46px;height:46px;border-radius:50%;border:2px solid var(--line);background:#fff;font-weight:900;font-size:18px}
.rate button.sel{background:var(--btn);border-color:#d79a00}
input.nm{font:inherit;border:2px solid var(--line);border-radius:10px;padding:7px 10px;width:150px;text-align:center}
footer{text-align:center;color:#7d8f9c;font-size:12px;padding:6px}
</style>
</head>
<body>
<header><h1>🧪 타자 모험 실험실 <small id="ver"></small></h1><button class="btn gray" id="kbt">자판</button><button class="btn gray" id="home" style="display:none">← 목록</button></header>
<main id="main"></main>
<div class="kb" id="kb"></div>
<footer id="foot"></footer>
<div class="modal" id="modal"><div class="box" id="box"></div></div>
<script>
const VER = '0.1', DATE = '2026-11-20';
const $ = s => document.querySelector(s), esc = s => String(s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
$('#ver').textContent = 'v' + VER; $('#foot').textContent = `타자 모험 실험실 v${VER} (${DATE}) · 게임 시제품 시험용 · © kingkongssam`;
/* ---------- 한글 두벌식 입력 ---------- */
const KEYS = {KeyQ: 'ㅂㅃ', KeyW: 'ㅈㅉ', KeyE: 'ㄷㄸ', KeyR: 'ㄱㄲ', KeyT: 'ㅅㅆ', KeyY: 'ㅛ', KeyU: 'ㅕ', KeyI: 'ㅑ', KeyO: 'ㅐㅒ', KeyP: 'ㅔㅖ', KeyA: 'ㅁ', KeyS: 'ㄴ', KeyD: 'ㅇ', KeyF: 'ㄹ', KeyG: 'ㅎ', KeyH: 'ㅗ', KeyJ: 'ㅓ', KeyK: 'ㅏ', KeyL: 'ㅣ', KeyZ: 'ㅋ', KeyX: 'ㅌ', KeyC: 'ㅊ', KeyV: 'ㅍ', KeyB: 'ㅠ', KeyN: 'ㅜ', KeyM: 'ㅡ'};
const CHO = 'ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ', JUNG = ['ㅏ', 'ㅐ', 'ㅑ', 'ㅒ', 'ㅓ', 'ㅔ', 'ㅕ', 'ㅖ', 'ㅗ', 'ㅗㅏ', 'ㅗㅐ', 'ㅗㅣ', 'ㅛ', 'ㅜ', 'ㅜㅓ', 'ㅜㅔ', 'ㅜㅣ', 'ㅠ', 'ㅡ', 'ㅡㅣ', 'ㅣ'], JONG = ['', 'ㄱ', 'ㄲ', 'ㄱㅅ', 'ㄴ', 'ㄴㅈ', 'ㄴㅎ', 'ㄷ', 'ㄹ', 'ㄹㄱ', 'ㄹㅁ', 'ㄹㅂ', 'ㄹㅅ', 'ㄹㅌ', 'ㄹㅍ', 'ㄹㅎ', 'ㅁ', 'ㅂ', 'ㅂㅅ', 'ㅅ', 'ㅆ', 'ㅇ', 'ㅈ', 'ㅊ', 'ㅋ', 'ㅌ', 'ㅍ', 'ㅎ'];
function units(word) { const u = []; [...word].forEach((ch, si) => { const c = ch.charCodeAt(0) - 0xAC00; if (c < 0 || c > 11171) { u.push({j: ch, si}); return; } [CHO[Math.floor(c / 588)], ...JUNG[Math.floor(c % 588 / 28)], ...JONG[c % 28]].forEach(j => u.push({j, si})); }); return u; }
function W(text) { return {text, u: units(text), n: 0}; }
function wordHTML(w, active) { const syl = [...w.text]; return '<span class="w">' + syl.map((s, i) => { const tot = w.u.filter(x => x.si === i).length, done = w.u.slice(0, w.n).filter(x => x.si === i).length; return `<b class="${done >= tot ? 'd' : active && done > 0 || active && w.u[w.n] && w.u[w.n].si === i ? 'c' : ''}" style="--p:${done / tot * 100}%">${esc(s)}</b>`; }).join('') + '</span>'; }
const rnd = a => a[Math.floor(Math.random() * a.length)], shuf = a => a.map(x => [Math.random(), x]).sort((p, q) => p[0] - q[0]).map(x => x[1]);
function pick(pool, usedFirst, avoid) { const c = shuf(pool).find(t => !usedFirst.has(units(t)[0].j) && !(avoid || []).includes(t)); return c || rnd(pool); }
const SHORT = ['불', '물', '길', '문', '손', '달', '별', '꽃', '눈', '집', '숲', '강', '밤', '빛', '칼', '방', '힘', '춤', '곰', '새', '톱', '팔', '코', '차'];
const MID = ['나무', '바다', '구름', '토끼', '사자', '기차', '모자', '의자', '노래', '여우', '하늘', '다리', '우산', '가방', '시계', '거울', '포도', '친구', '학교', '마을', '보물', '지도', '열쇠', '방패', '화살', '치료', '붕대', '약초', '투구', '갑옷', '번개', '파도', '수박', '참외', '호수', '조개', '카드', '튜브', '쿠키', '피리'];
const LONG = ['무지개', '코끼리', '해바라기', '도서관', '자전거', '비행기', '고양이', '강아지', '놀이터', '운동장', '소나기', '눈사람', '거북이', '다람쥐', '개구리', '바나나', '토마토', '호랑이', '미끄럼틀', '수수께끼', '종이비행기', '아이스크림', '크레파스', '태권도'];
/* ---------- 기록 ---------- */
const Stat = {t0: 0, ok: 0, bad: 0, begin() { this.t0 = performance.now(); this.ok = 0; this.bad = 0; }, sec() { return (performance.now() - this.t0) / 1000; }, kpm() { return Math.round(this.ok / Math.max(1, this.sec()) * 60); }, acc() { return Math.round(this.ok / Math.max(1, this.ok + this.bad) * 100); }};
const Log = {get() { try { return JSON.parse(localStorage.getItem('tajaLab') || '[]'); } catch (e) { return []; } }, add(r) { const a = this.get(); a.push(r); try { localStorage.setItem('tajaLab', JSON.stringify(a.slice(-200))); } catch (e) {} }};
let cur = null;
function stop() { if (cur && cur.stop) cur.stop(); cur = null; }
function finish(game, title, detail) {
  const s = {game, sec: Math.round(Stat.sec()), kpm: Stat.kpm(), acc: Stat.acc()}; stop(); let rate = 0;
  $('#box').innerHTML = `<h2>${esc(title)}</h2><p>${detail}</p><p style="font-size:14px;color:#4a6272">걸린 시간 <b>${s.sec}초</b> · 분당 <b>${s.kpm}타</b> · 정확도 <b>${s.acc}%</b></p><p style="font-weight:800;margin-bottom:0">이 게임, 얼마나 재미있었나요?</p><div class="rate">${[1, 2, 3, 4, 5].map(n => `<button data-n="${n}">${n}</button>`).join('')}</div><p><input class="nm" id="nm" placeholder="이름(안 써도 돼요)" maxlength="8" value="${esc(localStorage.getItem('tajaLabName') || '')}"></p><p><button class="btn" id="sv">저장하고 목록으로</button> <button class="btn gray" id="again">다시 하기</button></p>`;
  $('#modal').classList.add('on'); document.querySelectorAll('.rate button').forEach(b => b.onclick = () => { rate = Number(b.dataset.n); document.querySelectorAll('.rate button').forEach(x => x.classList.toggle('sel', x === b)); });
  const save = () => { const nm = $('#nm').value.trim(); try { localStorage.setItem('tajaLabName', nm); } catch (e) {} Log.add(Object.assign(s, {rate, name: nm, win: /성공|승리|완성|탈출/.test(title) ? 1 : 0, at: new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 16)})); $('#modal').classList.remove('on'); };
  $('#sv').onclick = () => { save(); menu(); }; $('#again').onclick = () => { save(); GAMES[game].run(); };
}
/* ---------- 목록 ---------- */
const GAMES = {};
function menu() {
  stop(); document.body.classList.remove('play'); $('#home').style.display = 'none'; const log = Log.get(); const sum = k => { const a = log.filter(r => r.game === k), r = a.filter(x => x.rate); return a.length ? `${a.length}번 · 재미 ${r.length ? (r.reduce((s, x) => s + x.rate, 0) / r.length).toFixed(1) : '-'}점 · 분당 ${Math.round(a.reduce((s, x) => s + x.kpm, 0) / a.length)}타` : '아직 기록 없음'; };
  $('#main').innerHTML = `<p style="margin:2px 4px;font-size:14px;line-height:1.6">성격이 서로 다른 게임 <b>세 가지</b>를 도형만으로 만든 시제품이에요. 그림은 보지 말고 <b>"하는 일이 재미있는가"</b>만 봐 주세요. 한 판이 끝나면 재미 점수(1~5)를 남겨요.</p><div class="menu">${Object.entries(GAMES).map(([k, g]) => `<div class="card"><span class="tagk">${g.kind}</span><h2>${g.icon} ${g.name}</h2><p>${g.desc}</p><div style="font-size:12px;color:#6b7f8e">${sum(k)}</div><button class="btn" data-g="${k}">해 보기</button></div>`).join('')}</div>` +
    (log.length ? `<h3 style="margin:10px 4px 0;font-size:15px">기록 (${log.length}번) <button class="btn gray" id="cp" style="padding:4px 10px;font-size:12px">표 복사</button> <button class="btn gray" id="clr" style="padding:4px 10px;font-size:12px">모두 지우기</button></h3><div style="overflow:auto"><table><tr><th>때</th><th>이름</th><th>게임</th><th>결과</th><th>시간</th><th>분당 타수</th><th>정확도</th><th>재미</th></tr>${log.slice().reverse().map(r => `<tr><td>${esc(r.at.slice(5).replace('T', ' '))}</td><td>${esc(r.name || '-')}</td><td>${esc(GAMES[r.game] ? GAMES[r.game].name : r.game)}</td><td>${r.win ? '성공' : '실패'}</td><td>${r.sec}초</td><td>${r.kpm}</td><td>${r.acc}%</td><td>${r.rate || '-'}</td></tr>`).join('')}</table></div>` : '');
  document.querySelectorAll('[data-g]').forEach(b => b.onclick = () => GAMES[b.dataset.g].run());
  if ($('#cp')) $('#cp').onclick = () => { const t = '때\t이름\t게임\t결과\t시간(초)\t분당 타수\t정확도\t재미\n' + log.map(r => [r.at, r.name, GAMES[r.game] ? GAMES[r.game].name : r.game, r.win ? '성공' : '실패', r.sec, r.kpm, r.acc, r.rate || ''].join('\t')).join('\n'); (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(() => { $('#cp').textContent = '복사했어요'; }, () => { $('#cp').textContent = '복사가 안 돼요'; }); };
  if ($('#clr')) $('#clr').onclick = () => { if ($('#clr').dataset.sure) { localStorage.removeItem('tajaLab'); menu(); } else { $('#clr').dataset.sure = 1; $('#clr').textContent = '한 번 더 누르면 지워요'; } };
}
function open(html) { stop(); document.body.classList.add('play'); $('#home').style.display = ''; $('#main').innerHTML = `<div class="stage" id="stage">${html}</div>`; Stat.begin(); }
/* 낱말 카드 여러 장 중 첫 글쇠로 하나를 잡고 끝까지 치는 공통 처리 */
function typeInto(cards, lockRef, j, onDone, onBad) {
  let c = lockRef.v;
  if (!c) { c = cards.find(x => !x.off && x.w.u[0].j === j); if (!c) { Stat.bad++; onBad(null); return; } lockRef.v = c; }
  if (c.w.u[c.w.n].j !== j) { Stat.bad++; c.w.n = 0; lockRef.v = null; onBad(c); return; }
  Stat.ok++; c.w.n++; if (c.w.n >= c.w.u.length) { lockRef.v = null; onDone(c); }
}
/* ---------- 1. 명령 전투 ---------- */
GAMES.battle = {name: '명령 전투', icon: '⚔️', kind: '선택형', desc: '낱말이 곧 명령이에요. 적이 다음에 할 행동을 보고 <b>공격·강타·방어·회복</b> 중 무엇을 칠지 골라요. 적은 체력이 절반이 되면 화가 나서 빨라져요. 틀리면 그 낱말을 처음부터 다시 쳐요.',
  run() {
    open(`<div class="hud"><span id="b-stage"></span><span class="sp"></span><span>⌫ 를 누르면 고른 명령을 바꿀 수 있어요</span></div><div class="field"><div class="unit"><div class="blob me" id="b-me">🙂</div><div style="display:flex;gap:6px;align-items:center;width:100%"><b id="b-hp"></b><div class="bar"><i id="b-hpb"></i></div></div><div id="b-sh" style="font-weight:800;min-height:1.3em"></div></div><div class="unit"><div class="intent" id="b-int"></div><div class="blob foe" id="b-foe"></div><div style="display:flex;gap:6px;align-items:center;width:100%"><b id="b-fhp"></b><div class="bar"><i id="b-fhpb" style="background:#e5484d"></i></div></div></div></div><div class="msg" id="b-msg">적의 다음 행동을 보고 명령을 골라요</div><div class="cmds" id="b-cmds"></div>`);
    const FOES = [{n: '슬라임', i: '🟢', hp: 8, p: [['atk', 2, 6], ['atk', 2, 5], ['guard', 0, 5]]}, {n: '늑대', i: '🐺', hp: 12, p: [['atk', 3, 5], ['atk', 3, 4], ['big', 6, 8]]}, {n: '용', i: '🐲', hp: 18, p: [['atk', 3, 5], ['guard', 0, 5], ['big', 7, 8], ['atk', 4, 4]]}];
    const S = {hp: 12, max: 12, shield: false, fi: 0, foe: null, pi: 0, left: 0, tot: 1, stun: 0, lock: {v: null}, cards: [], raf: 0, last: performance.now(), over: false};
    const DEF = [['atk', '⚔ 공격 2', MID], ['smash', '💥 강타 6 · 방어 깨기', LONG], ['def', '🛡 방어 · 다음 공격 막기', SHORT], ['heal', '💚 회복 +3', MID]];
    const used = except => new Set(S.cards.filter(c => c !== except && c.w).map(c => c.w.u[0].j));
    S.cards = DEF.map(d => ({k: d[0], t: d[1], pool: d[2], w: null})); S.cards.forEach(c => { c.w = W(pick(c.pool, used(c))); });
    const say = t => { $('#b-msg').textContent = t; }, bump = id => { const e = $(id); e.classList.remove('hit'); void e.offsetWidth; e.classList.add('hit'); setTimeout(() => e.classList.remove('hit'), 160); };
    const setFoe = () => { const f = FOES[S.fi]; S.foe = {n: f.n, i: f.i, hp: f.hp, max: f.hp, p: f.p}; S.pi = 0; S.left = S.tot = f.p[0][2] + 2; $('#b-stage').textContent = `적 ${S.fi + 1} / ${FOES.length} · ${f.n}`; $('#b-foe').textContent = f.i; };

    const next = () => { S.pi = (S.pi + 1) % S.foe.p.length; S.left = S.tot = S.foe.p[S.pi][2] * (S.foe.hp <= S.foe.max / 2 ? .75 : 1); };
    const tick = now => { if (S.over) return; const dt = Math.min(.1, (now - S.last) / 1000); S.last = now; if (S.stun > 0) S.stun -= dt; else S.left -= dt;

      if (c.k === 'smash') { S.foe.hp -= 6; bump('#b-foe'); if (g) { S.stun = 3; say('💥 방어를 깨뜨렸어요! 적이 비틀거려요'); } else say('💥 강타! 6'); }
      if (c.k === 'def') { S.shield = true; say('🛡 방어 준비!'); }
      if (c.k === 'heal') { S.hp = Math.min(S.max, S.hp + 3); say('💚 회복 +3'); }
      c.w = W(pick(c.pool, used(c), [c.w.text]));
      if (S.foe.hp <= 0) { S.fi++; if (S.fi >= FOES.length) { S.over = true; paint(); finish('battle', '승리!', `세 적을 모두 물리쳤어요. 남은 체력 ${S.hp}`); return; } say('물리쳤어요! 다음 적이 와요'); setFoe(); } };
    setFoe(); paint(); S.raf = requestAnimationFrame(tick);
    cur = {key(j) { if (S.over) return; typeInto(S.cards, S.lock, j, done, c => { say(c ? '틀렸어요! 그 낱말은 처음부터' : '그 글자로 시작하는 명령이 없어요'); const e = $('#b-cmds'); e.classList.remove('shake'); void e.offsetWidth; e.classList.add('shake'); }); paint(); }, back() { if (S.lock.v) { S.lock.v.w.n = 0; S.lock.v = null; paint(); } }, stop() { S.over = true; cancelAnimationFrame(S.raf); }};
  }};
/* ---------- 2. 로봇 조립 ---------- */
GAMES.robot = {name: '로봇 조립', icon: '🤖', kind: '기억형', desc: '설계도가 잠깐 보였다가 사라져요. <b>아래에서 위로</b> 쌓는 순서를 외워서 부품 이름을 쳐요. 시간제한은 없어요. 헷갈리면 엿보기를 쓸 수 있어요.',
  run() {
    open(`<div class="hud"><span id="r-round"></span><span class="sp"></span><span id="r-info"></span><button class="btn gray" id="r-peek" style="padding:5px 12px">👀 엿보기 (Tab)</button></div><div class="robo"><div class="col" id="r-plan"><h3>설계도</h3></div><div class="col" id="r-build"><h3>내가 만든 로봇</h3></div></div><div class="msg" id="r-msg"></div><div class="bin" id="r-bin"></div>`);
    const PARTS = ['다리', '바퀴', '몸통', '엔진', '팔', '집게', '날개', '머리', '안테나', '꼬리', '스프링', '배터리', '프로펠러', '카메라', '투구'], COL = ['#4dabf7', '#ff8787', '#69db7c', '#b197fc', '#ffa94d', '#f783ac', '#3bc9db'];
    const S = {r: 0, n: [3, 4, 5], plan: [], built: 0, cards: [], lock: {v: null}, show: true, miss: 0, peek: 0, tm: 0, over: false};
    const say = t => { $('#r-msg').textContent = t; };
    const paint = () => { $('#r-round').textContent = `${S.r + 1} / 3번째 로봇 · 부품 ${S.plan.length}개`; $('#r-info').textContent = `틀림 ${S.miss} · 엿보기 ${S.peek}`;
      $('#r-plan').innerHTML = '<h3>설계도 (아래부터)</h3>' + S.plan.map((p, i) => `<div class="part ${S.show ? '' : 'q'}" style="${S.show ? 'background:' + COL[i % COL.length] : ''}">${S.show ? esc(p) : '?'}</div>`).join('');
      $('#r-build').innerHTML = '<h3>내가 만든 로봇</h3>' + S.plan.slice(0, S.built).map((p, i) => `<div class="part" style="background:${COL[i % COL.length]}">${esc(p)}</div>`).join('');
      $('#r-bin').innerHTML = S.show ? '' : S.cards.map(c => `<div class="cmd ${S.lock.v === c ? 'lock' : ''} ${c.off ? 'off' : ''}">${wordHTML(c.w, S.lock.v === c)}</div>`).join(''); };
    const reveal = sec => { S.show = true; S.lock.v = null; S.cards.forEach(c => { c.w.n = 0; }); paint(); say('순서를 외워요…'); clearTimeout(S.tm); S.tm = setTimeout(() => { S.show = false; say(`${S.built + 1}번째 부품부터 쳐요`); paint(); }, sec * 1000); };
    const round = () => { const n = S.n[S.r], uf = new Set(), all = []; for (const p of shuf(PARTS)) { const f = units(p)[0].j; if (!uf.has(f)) { uf.add(f); all.push(p); } if (all.length >= n + 2) break; } S.plan = all.slice(0, n); S.built = 0; S.cards = shuf(all).map(p => ({p, w: W(p)})); reveal(1.6 + n * .9); };
    const done = c => { if (c.p === S.plan[S.built]) { S.built++; c.off = true; say('딸깍! 맞아요'); if (S.built >= S.plan.length) { if (++S.r >= 3) { S.over = true; paint(); finish('robot', '로봇 완성!', `로봇 세 대를 모두 조립했어요. 틀림 ${S.miss}번 · 엿보기 ${S.peek}번`); return; } say('완성! 다음 로봇 설계도가 나와요'); paint(); clearTimeout(S.tm); S.tm = setTimeout(round, 1200); return; } } else { S.miss++; c.w.n = 0; say(S.plan.includes(c.p) ? '삐빅! 순서가 달라요' : '삐빅! 설계도에 없는 부품이에요'); } };
    $('#r-peek').onclick = () => cur && cur.peek(); round();
    cur = {key(j) { if (S.over || S.show) return; typeInto(S.cards, S.lock, j, done, c => { say(c ? '틀렸어요! 그 낱말은 처음부터' : '그 글자로 시작하는 부품이 없어요'); const e = $('#r-bin'); e.classList.remove('shake'); void e.offsetWidth; e.classList.add('shake'); }); if (!S.over) paint(); }, back() { if (S.lock.v) { S.lock.v.w.n = 0; S.lock.v = null; paint(); } }, peek() { if (S.over || S.show) return; S.peek++; reveal(1.8); }, stop() { S.over = true; clearTimeout(S.tm); }};
  }};
/* ---------- 3. 미궁 탐험 ---------- */
GAMES.maze = {name: '미궁 탐험', icon: '🔦', kind: '탐험·추리형', desc: '옆 칸의 낱말을 치면 그 칸으로 가요. 칸의 숫자는 <b>붙어 있는 함정의 수</b>예요. 횃불이 꺼지기 전에 🔑 열쇠를 찾아 🚪 문으로 나가요. 시간제한은 없지만 틀리면 횃불이 줄어요.',
  run() {
    open(`<div class="hud"><span id="m-torch"></span><span id="m-key"></span><span id="m-gem"></span><span class="sp"></span><span>숫자 = 옆에 붙은 함정 수</span></div><div class="maze" id="m-grid"></div><div class="msg" id="m-msg">옆 칸에 적힌 낱말을 쳐서 움직여요</div>`);
    const N = 5, id = (x, y) => y * N + x, nb = i => { const x = i % N, y = Math.floor(i / N), a = []; if (y > 0) a.push(i - N); if (x < N - 1) a.push(i + 1); if (y < N - 1) a.push(i + N); if (x > 0) a.push(i - 1); return a; };
    const S = {pos: id(0, N - 1), exit: id(N - 1, 0), key: -1, traps: new Set(), gems: new Set(), seen: new Set(), torch: 24, has: false, got: 0, cards: [], lock: {v: null}, over: false};
    const reach = (from, to) => { const q = [from], s = new Set([from]); while (q.length) { const c = q.shift(); if (c === to) return true; nb(c).forEach(n => { if (!s.has(n) && !S.traps.has(n)) { s.add(n); q.push(n); } }); } return false; };
    for (let g = 0; g < 200; g++) { const free = shuf([...Array(N * N).keys()].filter(i => i !== S.pos && i !== S.exit && !nb(S.pos).includes(i))); S.traps = new Set(free.slice(0, 5)); S.key = free.find(i => !S.traps.has(i) && Math.abs(i % N - 0) + Math.abs(Math.floor(i / N) - (N - 1)) >= 3); S.gems = new Set(free.filter(i => !S.traps.has(i) && i !== S.key).slice(0, 3)); if (reach(S.pos, S.key) && reach(S.key, S.exit)) break; }
    S.seen.add(S.pos); const say = t => { $('#m-msg').textContent = t; }, cnt = i => nb(i).filter(n => S.traps.has(n)).length;
    const deal = () => { const uf = new Set(); S.cards = nb(S.pos).map(to => { const t = pick(S.seen.has(to) ? SHORT : MID, uf); uf.add(units(t)[0].j); return {to, w: W(t)}; }); S.lock.v = null; };
    const paint = () => { $('#m-torch').textContent = '🔥 횃불 ' + Math.max(0, S.torch); $('#m-key').textContent = S.has ? '🔑 열쇠 있음' : '🔑 열쇠 없음'; $('#m-gem').textContent = '💎 ' + S.got;
      $('#m-grid').innerHTML = [...Array(N * N).keys()].map(i => { const v = S.seen.has(i), c = S.cards.find(x => x.to === i), tr = v && S.traps.has(i); const ic = i === S.pos ? '🙂' : i === S.exit ? '🚪' : tr ? '💥' : v && i === S.key && !S.has ? '🔑' : '';
        return `<div class="cell ${v ? 'v' : ''} ${i === S.pos ? 'me' : ''} ${tr ? 'trap' : ''} ${c && S.lock.v === c ? 'lock' : ''}">${v && !tr ? `<span class="n">${cnt(i)}</span>` : ''}${c ? wordHTML(c.w, S.lock.v === c) : `<span class="ic">${ic}</span>`}${c && i === S.exit ? '<span class="n" style="left:auto;right:4px">🚪</span>' : ''}</div>`; }).join(''); };
    const end = (win, t, d) => { S.over = true; S.cards = []; paint(); finish('maze', t, d); };
    const done = c => { S.torch--; S.pos = c.to; const first = !S.seen.has(c.to); S.seen.add(c.to); let m = `이 칸 옆의 함정: ${cnt(c.to)}개`;
      if (S.traps.has(c.to) && first) { S.torch -= 4; m = '💥 함정! 횃불 -4'; } if (c.to === S.key && !S.has) { S.has = true; m = '🔑 열쇠를 찾았어요! 문으로 가요'; } if (S.gems.has(c.to)) { S.gems.delete(c.to); S.got++; m = '💎 보석을 주웠어요!'; }
      if (c.to === S.exit) { if (S.has) return end(true, '탈출 성공!', `횃불 ${Math.max(0, S.torch)} 남기고 나왔어요. 보석 ${S.got}개`); m = '🚪 문이 잠겨 있어요. 열쇠가 필요해요'; }
      if (S.torch <= 0) return end(false, '횃불이 꺼졌어요', `미궁에서 길을 잃었어요. 보석 ${S.got}개`); say(m); deal(); };
    deal(); paint();
    cur = {key(j) { if (S.over) return; typeInto(S.cards, S.lock, j, done, c => { if (c) { S.torch--; say('틀렸어요! 횃불이 흔들려요 🔥-1'); if (S.torch <= 0) { end(false, '횃불이 꺼졌어요', `미궁에서 길을 잃었어요. 보석 ${S.got}개`); return; } } else say('그 글자로 시작하는 길이 없어요'); const e = $('#m-grid'); e.classList.remove('shake'); void e.offsetWidth; e.classList.add('shake'); }); if (!S.over) paint(); }, back() { if (S.lock.v) { S.lock.v.w.n = 0; S.lock.v = null; paint(); } }, stop() { S.over = true; }};
  }};
/* ---------- 입력 ---------- */
function onJamo(j) { if (cur && !$('#modal').classList.contains('on')) cur.key(j); }
addEventListener('keydown', e => { if (e.target && e.target.tagName === 'INPUT') return; if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.code === 'Backspace' || e.code === 'Escape') { if (cur && cur.back) { cur.back(); e.preventDefault(); } return; } if (e.code === 'Tab' && cur && cur.peek) { cur.peek(); e.preventDefault(); return; }
  const k = KEYS[e.code]; if (!k) return; e.preventDefault(); if (e.repeat) return; onJamo(e.shiftKey && k[1] ? k[1] : k[0]); });
let shift = false;
function kb() { const rows = [['KeyQ', 'KeyW', 'KeyE', 'KeyR', 'KeyT', 'KeyY', 'KeyU', 'KeyI', 'KeyO', 'KeyP'], ['KeyA', 'KeyS', 'KeyD', 'KeyF', 'KeyG', 'KeyH', 'KeyJ', 'KeyK', 'KeyL'], ['S', 'KeyZ', 'KeyX', 'KeyC', 'KeyV', 'KeyB', 'KeyN', 'KeyM', 'B']];
  $('#kb').innerHTML = rows.map(r => '<div class="r">' + r.map(c => c === 'S' ? `<button class="fn ${shift ? 'act' : ''}" data-k="S">쌍자음</button>` : c === 'B' ? '<button class="fn" data-k="B">⌫</button>' : `<button data-k="${c}">${shift && KEYS[c][1] ? KEYS[c][1] : KEYS[c][0]}</button>`).join('') + '</div>').join('');
  $('#kb').querySelectorAll('button').forEach(b => b.onpointerdown = e => { e.preventDefault(); const k = b.dataset.k; if (k === 'S') { shift = !shift; kb(); return; } if (k === 'B') { if (cur && cur.back) cur.back(); return; } onJamo(shift && KEYS[k][1] ? KEYS[k][1] : KEYS[k][0]); if (shift) { shift = false; kb(); } }); }
kb(); if (matchMedia('(pointer:coarse)').matches) $('#kb').classList.add('on');
$('#kbt').onclick = () => $('#kb').classList.toggle('on'); $('#home').onclick = menu; menu();
</script>
